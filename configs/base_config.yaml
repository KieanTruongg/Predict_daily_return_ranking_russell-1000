# Master Configuration for Daily Return Rankings Project
# Institutional Quant Research Pipeline (Point-In-Time Russell 1000)
# Updated: 2026-11-04 — Tier 2 Warehouse & 2D Matrices Migration

universe:
  name: "Russell_1000"
  min_stocks: 500
  target_stocks: 1000
  constituents_csv: "data/raw/universe/russell1000_constituents.csv"
  pit_by_year_json: "data/raw/universe/russell1000_pit_by_year.json"

data:
  raw_warehouse: "data/processed/constituents_market_data/russell1000_constituents_daily_ohlcv_1998_2026.parquet"
  canonical_warehouse: "data/processed/constituents_market_data/russell1000_constituents_daily_ohlcv_canonical_1998_2026.parquet"
  adjusted_warehouse: "data/processed/constituents_market_data/russell1000_constituents_daily_ohlcv_adjusted_1998_2026.parquet"
  matrices_dir: "data/processed/matrices"
  corporate_actions_dir: "data/processed/constituents_market_data/corporate_actions"

  # Institutional Trading Session Windows (Total: 7,252 NYSE sessions)
  start_date: "1998-01-02"
  warmup_end_date: "2000-06-30"       # 630 sessions: Warmup window for long-horizon features
  dev_start_date: "2000-07-01"        # 5,911 sessions: Development / Training & Validation window
  dev_end_date: "2023-12-29"
  oos_start_date: "2024-01-02"        # 711 sessions: Out-of-Sample window
  oos_end_date: "2026-10-30"
  oos_strictly_frozen: true           # Strict prohibition of access during feature engineering

portfolio:
  initial_capital: 10000000.0    # $10M book size
  target_leverage: 1.0           # Sum of absolute weights = 1.0 (50% Long, 50% Short)
  max_weight_per_stock: 0.05     # 5% max single stock exposure
  dollar_neutral: true           # Sum of weights strictly = 0

backtest:
  rebalance_frequency: "daily"
  transaction_cost_bps: 5.0      # 5 bps = 0.05% per side for US large cap
  risk_free_rate: 0.0            # 0% for dollar-neutral long-short spread
  annualization_factor: 252

metrics:
  target_metrics:
    - "annualized_return"
    - "annualized_volatility"
    - "sharpe_ratio"
    - "rank_ic"
    - "max_drawdown"
    - "turnover"
    - "win_rate"
